[package]
license.workspace = true
readme.workspace = true
repository.workspace = true
name = "er"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Er, errors with less r"
keywords = ["error", "error-handling", "context", "report", "no_std"]
categories = ["rust-patterns", "no-std"]

[package.metadata.docs.rs]
all-features = true

[lib]
doctest = false

[features]
default = ["src_locations", "macros"]
std = []
src_locations = []
stack_traces = ["std"]
small_path_src = []
macros = ["dep:er-macros"]

[dependencies]
er-macros = { version = "=0.10.0", path = "../er-macros", optional = true }

[lints]
workspace = true

[[example]]
name = "context"
path = "runnable_examples/context.rs"
required-features = ["macros"]

[[example]]
name = "stack_traces"
path = "runnable_examples/stack_traces.rs"
required-features = ["macros", "stack_traces"]
