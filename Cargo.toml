[workspace]
resolver = "3"
members = ["er", "er-macros"]
exclude = ["integrations"]

[workspace.package]
license = "MIT-0"
readme = "README.md"
repository = "https://github.com/Viterkim/er"
version = "0.2.1"
edition = "2024"
rust-version = "1.89"
publish = true

[workspace.dependencies]
proc-macro2 = "1.0"
quote = "1.0"
serde = { version = "1", default-features = false, features = ["derive", "alloc"] }
serde_json = "1"
syn = { version = "3.0", features = ["parsing", "visit", "fold"] }

[workspace.lints.rust]
unsafe_code = "deny"
