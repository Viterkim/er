[package]
license.workspace = true
readme = "README.md"
repository.workspace = true
name = "er-unsync"
version.workspace = true
edition.workspace = true
rust-version.workspace = true
publish.workspace = true
description = "Er with Rc sharing and errors without Send/Sync requirements"
keywords = ["error", "error-handling", "context", "report", "no_std"]
categories = ["rust-patterns", "no-std"]

[package.metadata.docs.rs]
all-features = true

[lib]
path = "../er/src/lib.rs"
doctest = false

[features]
default = ["src_locations", "macros"]
std = []
src_locations = []
stack_traces = ["std"]
small_path_src = []
macros = ["dep:er-macros"]

[dependencies]
er-macros = { version = "=0.10.0", path = "../er-macros", optional = true }

[lints]
workspace = true
